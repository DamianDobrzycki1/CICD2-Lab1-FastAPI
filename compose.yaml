
services:
  user-service:
    build: 
      context: .
      dockerfile: Dockerfile.user
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./app.db
    volumes:
      - user_data:/data

  product-service:
    build:
      context: .
      dockerfile: Dockerfile.product
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=http://127.0.0.1:8001
    volumes:
      - product_data:/data
  
volumes:
  user_data:
  product_data: